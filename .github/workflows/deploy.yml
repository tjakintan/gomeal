name: Deploy

on:
  push:
    branches:
      - chefNex

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_X_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_X_SSH_KEY }}
          script: |
            set -e

            echo "========== Changing to project directory =========="
            cd ~/chefNex

            echo "========== Updating repository =========="
            git fetch origin chefNex
            git reset --hard origin/chefNex

            echo "========== Building and starting ChefNex =========="
            docker compose up -d --build --remove-orphans

            echo "========== Container Status =========="
            docker compose ps

            echo "========== Docker Stats =========="
            docker stats --no-stream

            echo "========== ChefNex Health =========="
            CONTAINER_ID=$(docker compose ps -q chefNex)

            if [ -z "$CONTAINER_ID" ]; then
              echo "ERROR: ChefNex container was not found."
              docker compose ps -a
              exit 1
            fi

            docker inspect "$CONTAINER_ID" \
              --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}'

            echo "========== Memory Usage =========="
            free -h

            echo "========== Disk Usage =========="
            df -h

            echo "========== ChefNex Logs =========="
            docker compose logs chefNex --tail=100

            echo "========== Cleaning Unused Images =========="
            docker image prune -f

            echo "========== Docker Disk Usage =========="
            docker system df

            echo "========== Deployment Complete =========="
