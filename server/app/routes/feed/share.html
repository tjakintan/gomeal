<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}}</title>

        <link rel="icon" href="https://gomeal.org/logo/gomeal_app.png" />
        <link rel="apple-touch-icon" href="https://gomeal.org/logo/gomeal_app.png" />

        <!-- Open Graph / WhatsApp -->
        <meta property="og:site_name" content="GoMeal" />
        <meta property="og:title" content="{{title}}" />
        <meta property="og:description" content="{{description}}" />
        <meta property="og:image" content="{{image}}" />
        <meta property="og:image:secure_url" content="{{image}}" />
        <meta property="og:url" content="{{url}}" />
        <meta property="og:type" content="website" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{title}}" />
        <meta name="twitter:description" content="{{description}}" />
        <meta name="twitter:image" content="{{image}}" />

        <!-- Smart App Banner -->
        <meta name="apple-itunes-app" content="app-id={{app_store_id}}, app-argument=gomeal://share/{{post_id}}" />

        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                margin: 0;
                background: #000;
                color: #fff;
            }

            .wrap {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 20px;
                box-sizing: border-box;
            }

            .share-card {
                width: 100%;
                max-width: 420px;
                overflow: hidden;
                border-radius: 30px;
                background: #6f9b91;
            }

            .image-wrap {
                position: relative;
                background: #111;
            }

            .post-image {
                display: block;
                width: 100%;
                height: 420px;
                object-fit: cover;
            }

            .domain-badge {
                position: absolute;
                top: 18px;
                left: 18px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 18px;
                border-radius: 999px;
                background: rgba(40, 40, 40, 0.92);
                color: #fff;
                font-size: 18px;
                font-weight: 700;
                line-height: 1;
            }

            .domain-icon {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: #fff;
                color: #222;
                font-size: 18px;
            }

            .info-panel {
                display: grid;
                grid-template-columns: 74px minmax(0, 1fr) auto;
                gap: 16px;
                align-items: center;
                padding: 24px 18px 28px;
                background: #6f9b91;
            }

            .app-logo {
                width: 64px;
                height: 64px;
                border-radius: 18px;
                object-fit: cover;
                background: #fff;
                border: 1px solid rgba(255, 255, 255, 0.7);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            }

            .copy {
                min-width: 0;
                text-align: left;
            }

            h1 {
                font-size: 23px;
                line-height: 1.16;
                margin: 0 0 6px;
                font-weight: 750;
                color: #fff;
            }

            p {
                color: rgba(214, 255, 247, 0.78);
                font-size: 19px;
                line-height: 1.25;
                margin: 0;
            }

            .open-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 92px;
                min-height: 54px;
                padding: 0 22px;
                border-radius: 999px;
                background: #1295f9;
                color: #fff;
                text-decoration: none;
                font-size: 22px;
                font-weight: 700;
                white-space: nowrap;
            }

            .download-link {
                display: block;
                margin-top: 18px;
                color: rgba(255, 255, 255, 0.72);
                font-size: 13px;
                text-align: center;
                text-decoration: none;
            }

            @media (max-width: 430px) {
                .wrap {
                    padding: 20px 14px;
                }

                .share-card {
                    border-radius: 26px;
                }

                .post-image {
                    height: 360px;
                }

                .info-panel {
                    grid-template-columns: 62px minmax(0, 1fr);
                }

                .app-logo {
                    width: 56px;
                    height: 56px;
                    border-radius: 16px;
                }

                .open-btn {
                    grid-column: 2;
                    justify-self: start;
                    min-height: 48px;
                    margin-top: 4px;
                    font-size: 19px;
                }
            }
        </style>
    </head>

    <body>
        <main class="wrap">
            <section class="share-card">
                <div class="image-wrap">
                    <img class="post-image" src="{{image}}" alt="{{title}}" />

                    <div class="domain-badge">
                        <span class="domain-icon">↗</span>
                        <span>gomeal.org</span>
                    </div>
                </div>

                <div class="info-panel">
                    <img class="app-logo" src="https://gomeal.org/logo/gomeal_app.png" alt="GoMeal" />

                    <div class="copy">
                        <h1>{{title}}</h1>
                        <p>{{description}}</p>
                    </div>

                    <a class="open-btn" href="gomeal://share/{{post_id}}">Open</a>
                </div>
            </section>
        </main>
    </body>
</html>
