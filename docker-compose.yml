services:
  chefnex:
    container_name: chefnex
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - config.env
      - .env
    environment:
      BACK_END_PORT: "6970"
    ports:
      - "6970:6970"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    stop_grace_period: 30s
    volumes:
      - ./.env:/.env:ro
      - ./.env.production:/.env.production:ro
      - ./.env.development:/.env.development:ro
      - ./config.env:/config.env:ro
    gpus: all
