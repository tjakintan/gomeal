
services:

  server:
    build: ./server
    ports:
      - "3000:3000"
    env_file:
      - config.env
      - server/.env
    depends_on:
      ml:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build: ./ml
    ports:
      - "6969:6969"
    env_file:
      - ml/.env
    volumes:
      - /home/ubuntu/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6969/health', timeout=4)"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
