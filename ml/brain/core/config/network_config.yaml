# -----------------------------------------------------------------------
# Learning
# -----------------------------------------------------------------------
learning_rate: 0.03
decay_rate: 0.01

# -----------------------------------------------------------------------
# Brain / synapse
# -----------------------------------------------------------------------
brain_boost: 0.03

# -----------------------------------------------------------------------
# Macro neuron patterns
# -----------------------------------------------------------------------
macro_pattern_min_count: 3

# -----------------------------------------------------------------------
# Multi-user collaborative learning
# -----------------------------------------------------------------------
multi_user_recent_window: 10
multi_user_min_coactivation: 3
multi_user_boost: 0.12
max_coactivation_count: 50

# -----------------------------------------------------------------------
# Seen-post handling
# -----------------------------------------------------------------------
seen_post_penalty: 1.5
seen_post_ttl_seconds: 21600
served_seen_ratio: 0.5
served_seen_max_count: 10

# -----------------------------------------------------------------------
# Candidate pool
# -----------------------------------------------------------------------
candidate_multiplier: 3
min_candidate_limit: 500

# -----------------------------------------------------------------------
# Diversity
# -----------------------------------------------------------------------
diversity_enabled: true
diversity_similarity_penalty: 0.35
diversity_max_similarity: 0.72
diversity_soft_penalty: 0.12

# -----------------------------------------------------------------------
# Scoring invariants (trend pipeline)
# -----------------------------------------------------------------------
min_trend_score: 0.01
trending_velocity_threshold: 0.05

# -----------------------------------------------------------------------
# Exploration invariants (feed output)
# -----------------------------------------------------------------------
explore_ratio: 0.20
new_post_ratio: 0.10
new_post_window_seconds: 172800
explore_similarity_threshold: 0.30

# -----------------------------------------------------------------------
# Collaborative score invariants
# -----------------------------------------------------------------------
multi_user_max_boost: 0.30
max_brain_contribution_ratio: 0.25
coactivation_decay_factor: 0.95